<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>우사기 랜덤 번호 뽑기</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Canvas Confetti Library for Visual FX -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- Google Fonts (Gaegu & Noto Sans KR for Cute Chalk/School Vibe) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #FFF9F2;
            background-image: radial-gradient(#FDE2E4 2px, transparent 2px);
            background-size: 24px 24px;
        }

        .font-cute {
            font-family: 'Gaegu', cursive;
        }

        /* Cute Card & Border styling */
        .pastel-card {
            background: rgba(255, 255, 255, 0.95);
            border: 4px solid #FFCAD4;
            box-shadow: 0 10px 25px -5px rgba(255, 182, 193, 0.4), 0 8px 10px -6px rgba(255, 182, 193, 0.2);
            border-radius: 2rem;
        }

        .pastel-btn {
            background: linear-gradient(135deg, #FFB5A7 0%, #FCD5CE 100%);
            box-shadow: 0 6px 0px #F8AD9D;
            transition: all 0.1s ease;
        }

        .pastel-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 0px #F8AD9D;
        }

        .pastel-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0px #F8AD9D;
        }

        .pastel-btn:disabled {
            background: #E0E0E0;
            box-shadow: 0 4px 0px #BDBDBD;
            cursor: not-allowed;
            transform: none;
        }

        /* Usagi Ears Animation */
        @keyframes earWiggle {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-6deg); }
            75% { transform: rotate(6deg); }
        }

        .ear-left {
            transform-origin: bottom right;
            animation: earWiggle 3s infinite ease-in-out;
        }

        .ear-right {
            transform-origin: bottom left;
            animation: earWiggle 3s infinite ease-in-out 0.3s;
        }

        /* Usagi Bounce when picking */
        .usagi-bounce {
            animation: usagiJump 0.4s infinite alternate ease-in-out;
        }

        @keyframes usagiJump {
            from { transform: translateY(0) scale(1); }
            to { transform: translateY(-15px) scale(1.05, 0.95); }
        }

        /* Number Display slot animation */
        .number-glow {
            text-shadow: 0 0 20px rgba(255, 181, 167, 0.6);
        }

        /* Checkbox Custom styling */
        .custom-checkbox:checked {
            background-color: #FFB5A7;
            border-color: #F8AD9D;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-4 md:p-8 text-gray-700 select-none">

    <!-- Header Section -->
    <header class="text-center mt-2 mb-4">
        <h1 class="font-cute text-4xl sm:text-6xl font-bold text-pink-400 drop-shadow-sm flex items-center justify-center gap-2">
            <span>🐰</span> 우사기 번호 뽑기 <span>✨</span>
        </h1>
        <p class="text-gray-500 text-sm sm:text-base font-medium mt-1">
            오늘의 행운아는 누구일까요? 교실에서 즐겁게 뽑아봐요!
        </p>
    </header>

    <!-- Main Container -->
    <main class="w-full max-w-xl flex flex-col items-center gap-6">

        <!-- Controls Card (Total Students & Exclude Checkbox) -->
        <div class="pastel-card w-full p-4 sm:p-6 flex flex-col sm:flex-row items-center justify-between gap-4">
            <!-- Total Students Input -->
            <div class="flex items-center gap-3 w-full sm:w-auto justify-center">
                <label for="max-count" class="font-bold text-lg text-pink-500 whitespace-nowrap">
                    <i class="fa-solid fa-users mr-1"></i> 전체 학생 수:
                </label>
                <div class="flex items-center">
                    <input type="number" id="max-count" min="1" max="35" value="35"
                        class="w-20 text-center text-xl font-bold border-2 border-pink-300 rounded-xl py-1 px-2 focus:outline-none focus:ring-2 focus:ring-pink-400 text-pink-600 bg-pink-50/50">
                    <span class="ml-2 font-bold text-gray-600">명</span>
                </div>
            </div>

            <!-- Duplicate Exclusion Checkbox -->
            <div class="flex items-center gap-2 bg-pink-50/80 px-4 py-2 rounded-xl border border-pink-200">
                <input type="checkbox" id="no-repeat" checked
                    class="w-5 h-5 accent-pink-400 rounded cursor-pointer focus:ring-pink-300">
                <label for="no-repeat" class="font-bold text-sm sm:text-base text-gray-700 cursor-pointer select-none">
                    중복 없이 뽑기
                </label>
            </div>
        </div>

        <!-- Center Stage: Usagi + Display Box -->
        <div class="pastel-card w-full p-6 sm:p-8 flex flex-col items-center relative overflow-hidden">
            
            <!-- SVG Usagi Character Art -->
            <div id="usagi-character" class="relative w-36 h-36 sm:w-44 sm:h-44 mb-2 transition-transform duration-300">
                <svg viewBox="0 0 200 200" class="w-full h-full drop-shadow-md">
                    <!-- Left Ear -->
                    <g class="ear-left">
                        <ellipse cx="70" cy="50" rx="16" ry="45" fill="#FFFFFF" stroke="#FFCAD4" stroke-width="6"/>
                        <ellipse cx="70" cy="52" rx="9" ry="32" fill="#FFB5A7" opacity="0.7"/>
                    </g>
                    <!-- Right Ear -->
                    <g class="ear-right">
                        <ellipse cx="130" cy="50" rx="16" ry="45" fill="#FFFFFF" stroke="#FFCAD4" stroke-width="6"/>
                        <ellipse cx="130" cy="52" rx="9" ry="32" fill="#FFB5A7" opacity="0.7"/>
                    </g>
                    <!-- Head -->
                    <circle cx="100" cy="125" r="58" fill="#FFFFFF" stroke="#FFCAD4" stroke-width="6"/>
                    <!-- Cheeks -->
                    <circle cx="68" cy="132" r="11" fill="#FCD5CE" opacity="0.8"/>
                    <circle cx="132" cy="132" r="11" fill="#FCD5CE" opacity="0.8"/>
                    <!-- Eyes -->
                    <ellipse cx="78" cy="120" rx="5" ry="7" fill="#4A4A4A"/>
                    <ellipse cx="122" cy="120" rx="5" ry="7" fill="#4A4A4A"/>
                    <circle cx="76" cy="118" r="2" fill="#FFFFFF"/>
                    <circle cx="120" cy="118" r="2" fill="#FFFFFF"/>
                    <!-- Nose & Mouth (Y shape) -->
                    <polygon points="100,126 96,131 104,131" fill="#FF96AD"/>
                    <path d="M 100,131 Q 95,138 90,135 M 100,131 Q 105,138 110,135" stroke="#4A4A4A" stroke-width="3" stroke-linecap="round" fill="none"/>
                    <!-- Whiskers/Details -->
                    <path d="M 50,125 L 38,122 M 52,132 L 36,133 M 150,125 L 162,122 M 148,132 L 164,133" stroke="#FFCAD4" stroke-width="3" stroke-linecap="round"/>
                </svg>
            </div>

            <!-- Number Display Canvas/Box -->
            <div class="w-full bg-gradient-to-b from-orange-50 to-pink-50 border-4 border-dashed border-pink-200 rounded-2xl py-6 my-2 text-center relative shadow-inner">
                <span id="display-number" class="font-cute text-7xl sm:text-9xl font-bold text-pink-500 tracking-wider number-glow">
                    ?
                </span>
                <p id="status-text" class="text-xs sm:text-sm text-pink-400 font-bold mt-1">
                    버튼을 눌러 뽑아주세요!
                </p>
            </div>

            <!-- Draw Button -->
            <button id="draw-btn" class="pastel-btn w-full py-4 sm:py-5 mt-4 rounded-2xl text-white font-black text-2xl sm:text-3xl tracking-widest flex items-center justify-center gap-3">
                <i class="fa-solid fa-wand-magic-sparkles"></i>
                <span>번호 뽑기!</span>
            </button>
        </div>

        <!-- History Card -->
        <div class="pastel-card w-full p-4 sm:p-6">
            <div class="flex items-center justify-between mb-3 border-b-2 border-pink-100 pb-2">
                <h3 class="font-bold text-base sm:text-lg text-gray-700 flex items-center gap-2">
                    <i class="fa-solid fa-clock-rotate-left text-pink-400"></i>
                    뽑힌 번호 기록 (<span id="history-count">0</span>명)
                </h3>
                <button id="reset-btn" class="text-xs sm:text-sm text-gray-400 hover:text-pink-500 font-bold underline transition-colors flex items-center gap-1">
                    <i class="fa-solid fa-rotate-right"></i> 초기화
                </button>
            </div>

            <!-- History Badges Grid -->
            <div id="history-list" class="flex flex-wrap gap-2 sm:gap-3 min-h-[50px] max-h-36 overflow-y-auto p-1 items-center">
                <span id="empty-history-msg" class="text-gray-400 text-sm font-medium italic w-full text-center py-2">
                    아직 뽑힌 번호가 없어요 🐾
                </span>
            </div>
        </div>
    </main>

    <!-- Custom Modal Toast for Notifications -->
    <div id="toast" class="fixed bottom-6 bg-gray-800 text-white px-6 py-3 rounded-full text-sm font-bold opacity-0 transition-opacity duration-300 pointer-events-none shadow-lg">
        알림 메시지
    </div>

    <!-- Footer -->
    <footer class="mt-8 text-center text-xs text-pink-300 font-medium">
        🌸 즐거운 우리 반! 우사기 랜덤 번호 뽑기 🌸
    </footer>

    <!-- Application Logic -->
    <script>
        // DOM Elements
        const maxCountInput = document.getElementById('max-count');
        const noRepeatCheckbox = document.getElementById('no-repeat');
        const drawBtn = document.getElementById('draw-btn');
        const resetBtn = document.getElementById('reset-btn');
        const displayNumber = document.getElementById('display-number');
        const statusText = document.getElementById('status-text');
        const historyList = document.getElementById('history-list');
        const historyCount = document.getElementById('history-count');
        const emptyHistoryMsg = document.getElementById('empty-history-msg');
        const usagiChar = document.getElementById('usagi-character');
        const toast = document.getElementById('toast');

        // State
        let pickedNumbers = [];
        let isSpinning = false;

        // Input validation & clamp
        maxCountInput.addEventListener('change', () => {
            let val = parseInt(maxCountInput.value);
            if (isNaN(val) || val < 1) val = 1;
            if (val > 35) val = 35;
            maxCountInput.value = val;
            
            // Auto reset if max decreased below picked items limit count logically
            checkHistoryState();
        });

        // Toast Helper
        function showToast(message) {
            toast.textContent = message;
            toast.classList.remove('opacity-0');
            toast.classList.add('opacity-100');
            setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0');
            }, 2500);
        }

        // Check and sync history UI
        function checkHistoryState() {
            historyCount.textContent = pickedNumbers.length;
            if (pickedNumbers.length > 0) {
                if (emptyHistoryMsg) emptyHistoryMsg.style.display = 'none';
            } else {
                if (emptyHistoryMsg) emptyHistoryMsg.style.display = 'block';
            }
        }

        // Trigger Confetti Effect
        function fireConfetti() {
            const count = 200;
            const defaults = {
                origin: { y: 0.7 }
            };

            function fire(particleRatio, opts) {
                confetti(Object.assign({}, defaults, opts, {
                    particleCount: Math.floor(count * particleRatio)
                }));
            }

            fire(0.25, {
                spread: 26,
                startVelocity: 55,
                colors: ['#FFB5A7', '#FCD5CE', '#F8AD9D']
            });
            fire(0.2, {
                spread: 60,
                colors: ['#FFFFFF', '#FFCAD4']
            });
            fire(0.35, {
                spread: 100,
                decay: 0.91,
                scalar: 0.8
            });
            fire(0.1, {
                spread: 120,
                startVelocity: 25,
                decay: 0.92,
                colors: ['#FFE5EC', '#FFB5A7']
            });
            fire(0.1, {
                spread: 120,
                startVelocity: 45,
            });
        }

        // Draw Logic
        function drawNumber() {
            if (isSpinning) return;

            const maxNum = parseInt(maxCountInput.value);
            const isNoRepeat = noRepeatCheckbox.checked;

            // Validation for duplicate mode
            if (isNoRepeat && pickedNumbers.length >= maxNum) {
                showToast(`1부터 ${maxNum}까지 모든 번호가 이미 모두 뽑혔어요! 리셋 후 사용해주세요.`);
                return;
            }

            // Start Animation state
            isSpinning = true;
            drawBtn.disabled = true;
            statusText.textContent = "두구두구... 추첨 중!";
            statusText.classList.add('animate-pulse');
            usagiChar.classList.add('usagi-bounce');

            // Slot Machine Animation effect setup
            let counter = 0;
            const totalDuration = 2000; // 2 seconds
            const speed = 40; // Interval speed in ms

            const interval = setInterval(() => {
                const randomTemp = Math.floor(Math.random() * maxNum) + 1;
                displayNumber.textContent = randomTemp;
                counter += speed;

                if (counter >= totalDuration) {
                    clearInterval(interval);
                    finalizeDraw(maxNum, isNoRepeat);
                }
            }, speed);
        }

        // Finalize state after animation
        function finalizeDraw(maxNum, isNoRepeat) {
            let finalNumber;

            if (isNoRepeat) {
                // Get available array
                const available = [];
                for (let i = 1; i <= maxNum; i++) {
                    if (!pickedNumbers.includes(i)) {
                        available.push(i);
                    }
                }
                finalNumber = available[Math.floor(Math.random() * available.length)];
                pickedNumbers.push(finalNumber);
            } else {
                finalNumber = Math.floor(Math.random() * maxNum) + 1;
                pickedNumbers.push(finalNumber);
            }

            // Display Final Number
            displayNumber.textContent = finalNumber;
            statusText.textContent = `🎉 당첨! ${finalNumber}번 축하합니다! 🎉`;
            statusText.classList.remove('animate-pulse');

            // Visual Celebrations
            usagiChar.classList.remove('usagi-bounce');
            fireConfetti();

            // Add History Badge
            renderHistoryItem(finalNumber, pickedNumbers.length);
            checkHistoryState();

            // Re-enable Button
            isSpinning = false;
            drawBtn.disabled = false;
        }

        // Add item badge to history UI
        function renderHistoryItem(number, order) {
            const badge = document.createElement('div');
            badge.className = "flex items-center gap-1.5 bg-pink-100 border border-pink-300 text-pink-600 font-bold px-3 py-1.5 rounded-full text-sm sm:text-base animate-bounce";
            badge.style.animationDuration = '0.5s';
            badge.style.animationIterationCount = '1';
            badge.innerHTML = `
                <span class="text-xs text-pink-400 font-normal">#${order}</span>
                <span>${number}번</span>
            `;
            
            // Insert at the beginning of the list
            historyList.insertBefore(badge, historyList.firstChild);
        }

        // Reset History Logic
        function resetHistory() {
            if (pickedNumbers.length === 0) {
                showToast("초기화할 뽑기 기록이 없습니다.");
                return;
            }

            pickedNumbers = [];
            historyList.innerHTML = '';
            
            // Re-add empty placeholder
            const emptyMsg = document.createElement('span');
            emptyMsg.id = 'empty-history-msg';
            emptyMsg.className = 'text-gray-400 text-sm font-medium italic w-full text-center py-2';
            emptyMsg.textContent = '아직 뽑힌 번호가 없어요 🐾';
            historyList.appendChild(emptyMsg);

            displayNumber.textContent = '?';
            statusText.textContent = '버튼을 눌러 뽑아주세요!';
            checkHistoryState();

            showToast("모든 기록이 초기화되었습니다.");
        }

        // Event Listeners
        drawBtn.addEventListener('click', drawNumber);
        resetBtn.addEventListener('click', resetHistory);

        // Keyboard Shortcut (Spacebar to draw)
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && e.target.tagName !== 'INPUT') {
                e.preventDefault();
                drawNumber();
            }
        });
    </script>
</body>
</html>
